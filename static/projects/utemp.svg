  <polyline points="38,162 76,144 114,148 152,110 190,118 228,84 266,92 296,72" fill="none" stroke="#a8492a" stroke-width="2.5"/>
  <circle cx="152" cy="110" r="4" fill="#a8492a"/>
  <circle cx="228" cy="84" r="4" fill="#a8492a"/>
  <circle cx="296" cy="72" r="4.5" fill="#ffffff" stroke="#a8492a" stroke-width="2"/>
