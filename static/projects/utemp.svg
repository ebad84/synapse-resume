<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260">
  <rect width="480" height="260" fill="#f6f5f1"/>
  <rect x="8" y="8" width="464" height="244" rx="10" fill="#ffffff" stroke="#e5e2da" stroke-width="1.5"/>
  <!-- Header -->
  <text x="24" y="34" font-family="monospace" font-weight="600" font-size="12" fill="#1c1b19">UTEMP // IoT TELEMETRY STREAM</text>
  <rect x="336" y="20" width="118" height="20" rx="5" fill="#f5e8e1" stroke="#a8492a"/>
  <text x="395" y="34" text-anchor="middle" font-family="monospace" font-size="10" fill="#a8492a">API KEY AUTH</text>
  <!-- Chart Grid -->
  <rect x="24" y="50" width="286" height="148" rx="8" fill="#f6f5f1" stroke="#e5e2da"/>
  <line x1="24" y1="87" x2="310" y2="87" stroke="#e5e2da" stroke-dasharray="4 4"/>
  <line x1="24" y1="124" x2="310" y2="124" stroke="#e5e2da" stroke-dasharray="4 4"/>
  <line x1="24" y1="161" x2="310" y2="161" stroke="#e5e2da" stroke-dasharray="4 4"/>
